name: CI

on:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - "docs/**"
      - "LICENSE"
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore: *paths-ignore

permissions:
  contents: read # Required for checking out code

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check no files generated
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Files were generated or modified after pnpm install"
            git status --porcelain
            exit 1
          fi

      - name: Run cicheck
        run: pnpm cicheck

      - name: Build
        run: pnpm build

      - name: Check no uncommitted changes after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes detected after build"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Installer, packaged entrypoints and release transaction checks
        run: pnpm test:distribution

      - name: Host harness unit checks (no OpenCode binary or model calls)
        run: python3 -m unittest discover -s tests/host -p 'test_helpers.py'

      # V2 2.0.30 has no upstream release asset. Real-host acceptance requires
      # an explicitly supplied installed V2 binary; see TASK-AWARE.md.
